name: Set up database backup-to-Telegram timer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose (read-only, safe) or apply (installs the systemd timer)"
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - apply

permissions:
  contents: read

concurrency:
  group: megamall-production-db-backup-setup
  cancel-in-progress: false

jobs:
  setup-db-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SERVER_USER: deploy
      PROJECT: /var/www/megamall-crm

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure verified SSH access
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s %s\n' "$SERVER_HOST" \
            'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOyShTb8NPuH+bPPBFOjV0e/8PI+Tg0pXPbq/V3dlUmq' \
            > "$HOME/.ssh/known_hosts"

      # Read-only: doesn't touch /etc or systemd, so no sudo is needed. Runs
      # as the plain `deploy` login, which is why the .env check can only
      # confirm the file exists — that account can't read its contents.
      - name: Diagnose (read-only)
        if: ${{ inputs.mode == 'diagnose' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -Eeuo pipefail
          SSH_ARGS=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${SSH_ARGS[@]}" "$SERVER_USER@$SERVER_HOST" "
            set -Eeuo pipefail
            echo '== pg_dump / curl available? =='
            command -v pg_dump && pg_dump --version || echo 'pg_dump not found'
            command -v curl && curl --version | head -1 || echo 'curl not found'
            echo
            echo '== backup script present? =='
            ls -la '$PROJECT/megamall-crm/scripts/backup_db_telegram.sh' || true
            echo
            echo '== .env present? (contents unreadable by this account, by design) =='
            ls -la '$PROJECT/megamall-crm/.env' || true
            echo
            echo '== existing timer? =='
            systemctl list-timers megamall-crm-backup.timer --no-pager || true
          "

      # apply uploads the backup script to /tmp (unprivileged scp, same
      # path deploy.sh's own self-update uses) then hands it to deploy.sh
      # — the one command the deploy account can run as root without a
      # password — to install into place and set up the systemd timer.
      - name: Upload backup script
        if: ${{ inputs.mode == 'apply' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -Eeuo pipefail
          SSH_ARGS=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${SSH_ARGS[@]}" "megamall-crm/scripts/backup_db_telegram.sh" \
            "$SERVER_USER@$SERVER_HOST:/tmp/megamall-crm-backup_db_telegram.sh"

      - name: Install backup timer via deploy.sh
        if: ${{ inputs.mode == 'apply' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -Eeuo pipefail
          SSH_ARGS=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${SSH_ARGS[@]}" "$SERVER_USER@$SERVER_HOST" \
            "sudo --non-interactive $PROJECT/deploy.sh install-backup-timer /tmp/megamall-crm-backup_db_telegram.sh"
